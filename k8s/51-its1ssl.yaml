apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: its1ssl
  namespace: yatest
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure-ssl
  hostnames:
    - its1ssl.example.com
  rules:
    - backendRefs:
        - name: yagolangsite-service
          port: 80
